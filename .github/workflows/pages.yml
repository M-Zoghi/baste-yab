name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/configure-pages@v5

      - name: Build (static export)
        env:
          BUILD_MODE: pages
          # project pages serve from /<repo>/; user root pages (<user>.github.io) need no prefix
          NEXT_PUBLIC_BASE_PATH: ${{ (endsWith(github.repository, '.github.io') && '') || format('/{0}', github.event.repository.name) }}
        run: |
          bun install --frozen-lockfile
          bun run lint || true
          bunx next build

      - name: Copy DATA.md into the export
        run: cp DATA.md out/DATA.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
