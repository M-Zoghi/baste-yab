name: Refresh provider data

on:
  schedule:
    - cron: "30 3 * * *" # daily 03:30 UTC (07:00 Tehran)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Providers reachable from outside Iran (samantel, aptel, mci) refresh here;
      # geo-blocked ones (irancell/rightel/tci/asiatech) keep their file
      # until a contributor pushes an update from inside Iran (see DATA.md).
      - name: Run adapters
        run: node update/fetch-providers.mjs

      - name: Commit if changed
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/providers
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +%F)"
            git push
          fi
